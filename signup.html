<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account with Swikar Acharya.">
  <title>Create account | Swikar Acharya</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <button class="theme-toggle auth-theme-toggle" type="button" aria-label="Switch theme" aria-pressed="true">☀</button>
  <main class="login-container">
    <section class="login-form" aria-labelledby="signup-title">
      <a class="back-link" href="index.html">&larr; Back to home</a>

      <div class="login-heading">
        <p class="eyebrow">GET STARTED</p>
        <h1 id="signup-title" class="title">Create your account</h1>
        <p class="subtitle">Fill in your details to join us.</p>
      </div>

      <form action="#" method="post">
        <div class="form-field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="full-name" type="text" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
        </div>

        <div class="form-field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
        </div>

        <label class="remember-me">
          <input type="checkbox" name="terms" required>
          <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="btnprimary-btn">Create account</button>
      </form>

      <div class="divider" aria-hidden="true"><span>or</span></div>

      <button type="button" class="btngoogle-btn">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="" width="20" height="20">
        Sign up with Google
      </button>

      <p class="footer-text">Already have an account? <a href="sign_in.html">Sign in</a></p>
    </section>
  </main>
  <script src="theme.js"></script>
</body>
</html>
